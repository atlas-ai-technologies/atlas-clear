name: Deploy ATLAS Clear Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p public
          cp support.html privacy.html public/
          printf '%s\n' '<!DOCTYPE html><html lang="en"><meta charset="UTF-8"><title>ATLAS Clear</title><h1>ATLAS Clear</h1><p><a href="support.html">Support</a> | <a href="privacy.html">Privacy Policy</a></p></html>' > public/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
