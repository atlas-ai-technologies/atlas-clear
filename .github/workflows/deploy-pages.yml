name: Deploy ATLAS Clear Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p public
          cp support.html privacy.html secret-wishes-support.html secret-wishes-privacy.html public/
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ATLAS AI Technologies</title></head><body><main><h1>ATLAS Clear</h1><p><a href="support.html">ATLAS Clear Support</a> | <a href="privacy.html">ATLAS Clear Privacy Policy</a></p><section><h2>Secret Wishes</h2><p><a href="secret-wishes-support.html">Secret Wishes Support</a> | <a href="secret-wishes-privacy.html">Secret Wishes Privacy Policy</a></p></section></main></body></html>' > public/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4